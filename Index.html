<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matchday Multi Countdown</title>
  <style>
    :root {
      --text: #f3fff7;
      --muted: rgba(243,255,247,0.68);
      --green: #0f8f4c;
      --green2: #18b86a;
      --danger: #ff4d4d;
      --warning: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(24,184,106,0.23), transparent 35%),
        radial-gradient(circle at bottom right, rgba(15,143,76,0.17), transparent 35%),
        linear-gradient(135deg, #06100b 0%, #081911 55%, #031008 100%);
      color: var(--text);
      padding: 22px;
    }

    .app { max-width: 1440px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 68px);
      line-height: 0.9;
      letter-spacing: -0.07em;
      text-transform: uppercase;
    }

    p {
      margin: 10px 0 0;
      color: var(--muted);
    }

    .clock {
      text-align: right;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      min-width: 190px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .clock .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .clock .time {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr auto auto auto;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 22px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      margin-bottom: 18px;
    }

    input, button {
      font: inherit;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.13);
      background: rgba(0,0,0,0.26);
      color: var(--text);
      padding: 12px 14px;
      outline: none;
    }

    input::placeholder { color: rgba(243,255,247,0.45); }

    button {
      cursor: pointer;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      user-select: none;
    }

    .primary {
      background: linear-gradient(135deg, var(--green), var(--green2));
      border: 0;
    }

    .secondary { background: rgba(255,255,255,0.09); }

    .danger {
      background: rgba(255,77,77,0.13);
      border-color: rgba(255,77,77,0.35);
      color: #ffd1d1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 16px;
    }

    .timer {
      min-height: 230px;
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 22px;
      overflow: hidden;
    }

    .timer-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 18px;
    }

    .timer h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: -0.04em;
    }

    .timer .target {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .big {
      font-size: clamp(48px, 5.8vw, 92px);
      line-height: 0.9;
      font-weight: 950;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      margin: 22px 0 22px;
      text-align: center;
      white-space: nowrap;
      max-width: 100%;
    }

    .status {
      display: none;
    }

    .highlight { color: var(--warning); }

    .timer-actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 18px;
    }

    .small {
      font-size: 12px;
      padding: 10px 8px;
      min-width: 0;
    }

    .footer {
      color: rgba(243,255,247,0.52);
      margin-top: 14px;
      font-size: 13px;
    }



    .playerClock {
      display: none;
    }

    .player-mode .playerClock {
      display: block;
      position: fixed;
      top: clamp(18px, 2.2vw, 34px);
      right: clamp(18px, 2.2vw, 34px);
      z-index: 20;
      font-size: clamp(20px, 2vw, 34px);
      font-weight: 900;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: rgba(243,255,247,0.72);
      background: rgba(0,0,0,0.16);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 8px 13px;
      backdrop-filter: blur(8px);
    }

    @media (min-width: 1280px) {
      body:not(.player-mode) .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 1700px) {
      body:not(.player-mode) .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      body:not(.player-mode) .grid {
        grid-template-columns: 1fr;
      }
    }

    /* Clean player screen */
    .player-mode {
      padding: 0;
      cursor: none;
      overflow: hidden;
    }

    .player-mode .app {
      max-width: none;
      width: 100vw;
      height: 100vh;
      padding: clamp(28px, 4vw, 70px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-mode header,
    .player-mode .controls,
    .player-mode .footer,
    .player-mode .target,
    .player-mode .status,
    .player-mode .timer-actions,
    .player-mode .timer-top > button {
      display: none !important;
    }

    .player-mode .grid {
      width: min(1580px, 100%);
      height: 100%;
      display: grid;
      grid-template-columns: 1fr;
      align-content: center;
      justify-items: stretch;
      gap: clamp(24px, 4vh, 58px);
    }

    .player-mode.count-2 .grid {
      gap: clamp(80px, 11vh, 150px);
    }

    .player-mode.count-3 .grid {
      gap: clamp(56px, 7.5vh, 105px);
    }

    .player-mode.count-4 .grid {
      gap: clamp(38px, 5.2vh, 74px);
    }

    .player-mode.count-5 .grid,
    .player-mode.count-6 .grid {
      gap: clamp(24px, 3.4vh, 48px);
    }

    .player-mode.count-many .grid {
      gap: clamp(14px, 2.2vh, 30px);
    }

    .player-mode.count-1 .grid {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-mode .timer {
      width: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      padding: 0;
      overflow: visible;
      display: grid;
      grid-template-columns: clamp(430px, 36vw, 620px) minmax(0, 1fr);
      align-items: baseline;
      column-gap: clamp(70px, 7vw, 130px);
    }

    .player-mode.count-1 .timer {
      display: block;
      text-align: center;
      width: 100%;
    }

    .player-mode .timer-top {
      display: block;
      margin: 0;
      min-width: 0;
    }

    .player-mode .timer h2 {
      text-align: left;
      margin: 0;
      letter-spacing: -0.05em;
      color: rgba(243,255,247,0.88);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(34px, 5vw, 86px);
      line-height: 0.95;
    }

    .player-mode .big {
      margin: 0;
      text-align: left;
      line-height: 0.82;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-size: clamp(68px, 9.2vw, 158px);
      letter-spacing: -0.015em;
    }

    .player-mode.count-1 .timer h2 {
      text-align: center;
      font-size: clamp(46px, 7vw, 120px);
      margin-bottom: clamp(18px, 3vh, 46px);
    }

    .player-mode.count-1 .big {
      text-align: center;
      font-size: clamp(150px, 30vw, 460px);
      line-height: 0.82;
      letter-spacing: -0.015em;
    }

    .player-mode.count-2 .timer h2 {
      font-size: clamp(42px, 6vw, 110px);
    }

    .player-mode.count-2 .big {
      font-size: clamp(100px, 12.5vw, 220px);
      letter-spacing: -0.015em;
    }

    .player-mode.count-3 .timer h2 {
      font-size: clamp(38px, 5.4vw, 92px);
    }

    .player-mode.count-3 .big {
      font-size: clamp(82px, 9.2vw, 158px);
      letter-spacing: -0.015em;
    }

    .player-mode.count-3 .timer,
    .player-mode.count-4 .timer,
    .player-mode.count-5 .timer,
    .player-mode.count-6 .timer,
    .player-mode.count-many .timer {
      grid-template-columns: clamp(430px, 36vw, 620px) minmax(0, 1fr);
    }

    .player-mode.count-4 .timer h2,
    .player-mode.count-5 .timer h2,
    .player-mode.count-6 .timer h2,
    .player-mode.count-many .timer h2 {
      font-size: clamp(28px, 4.2vw, 70px);
    }

    .player-mode.count-4 .big,
    .player-mode.count-5 .big,
    .player-mode.count-6 .big,
    .player-mode.count-many .big {
      font-size: clamp(58px, 8vw, 136px);
      letter-spacing: -0.015em;
    }

    .player-mode .timer.active,
    .player-mode .timer.done,
    .player-mode .timer.negative {
      background: transparent;
      border: 0;
    }

    @media (max-width: 760px) {
      body { padding: 14px; }
      header { flex-direction: column; }
      .clock { width: 100%; text-align: left; }
      .controls { grid-template-columns: 1fr; }
      .timer-actions { grid-template-columns: 1fr 1fr; }

      .player-mode .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Matchday Board</h1>
        <p>Staff setup view. Player screen only shows countdown names and times.</p>
      </div>
      <div class="clock">
        <div class="label">Current time</div>
        <div class="time" id="currentTime">--:--:--</div>
      </div>
    </header>

    <section class="controls">
      <input id="timerName" placeholder="Name e.g. Tunnel / Warm-up / Kick-off" />
      <input id="timerTime" type="time" />
      <input id="timerDate" type="date" />
      <button class="primary" onclick="addTimer()">Add</button>
      <button class="secondary" onclick="enterPlayerMode()">Player screen</button>
      <button class="danger" onclick="clearAll()">Clear all</button>
    </section>

    <section class="grid" id="timers"></section>

    <div class="playerClock" id="playerClock">--:--:--</div>

    <div class="footer">
      In player screen only the names and times are visible. Press Escape to return to staff view.
    </div>
  </div>

  <script>
    const STORAGE_KEY = "matchday-multi-countdown-clean-player-v1";
    let timers = loadTimers();

    function pad(n) { return String(n).padStart(2, "0"); }

    function todayDateString() {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }

    document.getElementById("timerDate").value = todayDateString();

    function loadTimers() {
      const fallback = [
        createTimer("Kick-off", timeTodayPlusMinutes(90)),
        createTimer("Warm-up", timeTodayPlusMinutes(45)),
        createTimer("Tunnel", timeTodayPlusMinutes(82))
      ];
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || fallback;
      } catch {
        return fallback;
      }
    }

    function saveTimers() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(timers));
    }

    function createTimer(name, targetTime) {
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        name,
        targetTime,
        paused: false,
        pauseRemainingMs: null
      };
    }

    function timeTodayPlusMinutes(minutes) {
      const d = new Date(Date.now() + minutes * 60 * 1000);
      return d.toISOString();
    }

    function addTimer() {
      const name = document.getElementById("timerName").value.trim();
      const time = document.getElementById("timerTime").value;
      const date = document.getElementById("timerDate").value || todayDateString();

      if (!name || !time) {
        alert("Add both name and time.");
        return;
      }

      const target = new Date(`${date}T${time}:00`);
      if (isNaN(target.getTime())) {
        alert("Invalid date/time.");
        return;
      }

      timers.push(createTimer(name, target.toISOString()));
      saveTimers();
      render();

      document.getElementById("timerName").value = "";
      document.getElementById("timerTime").value = "";
    }

    function removeTimer(id) {
      timers = timers.filter(t => t.id !== id);
      saveTimers();
      render();
    }

    function clearAll() {
      if (!confirm("Remove all countdowns?")) return;
      timers = [];
      saveTimers();
      render();
    }

    function resetTimer(id) {
      const t = timers.find(x => x.id === id);
      if (!t) return;
      t.paused = false;
      t.pauseRemainingMs = null;
      saveTimers();
      render();
    }

    function togglePause(id) {
      const t = timers.find(x => x.id === id);
      if (!t) return;

      if (!t.paused) {
        t.pauseRemainingMs = new Date(t.targetTime).getTime() - Date.now();
        t.paused = true;
      } else {
        t.targetTime = new Date(Date.now() + t.pauseRemainingMs).toISOString();
        t.paused = false;
        t.pauseRemainingMs = null;
      }

      saveTimers();
      render();
    }

    function addMinutes(id, mins) {
      const t = timers.find(x => x.id === id);
      if (!t) return;

      if (t.paused) {
        t.pauseRemainingMs += mins * 60 * 1000;
      } else {
        t.targetTime = new Date(new Date(t.targetTime).getTime() + mins * 60 * 1000).toISOString();
      }

      saveTimers();
      render();
    }

    function formatRemaining(ms) {
      const negative = ms < 0;
      ms = Math.abs(ms);
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      if (hours > 0) return `${negative ? "-" : ""}${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      return `${negative ? "-" : ""}${pad(minutes)}:${pad(seconds)}`;
    }

    function statusText(ms, paused) {
      if (paused) return "Paused";
      if (ms < 0) return "Time passed";
      if (ms <= 60 * 1000) return "Final minute";
      if (ms <= 5 * 60 * 1000) return "Prepare now";
      return "Counting down";
    }

    function render() {
      const root = document.getElementById("timers");
      root.innerHTML = "";

      timers
        .slice()
        .sort((a,b) => {
          const ar = a.paused ? a.pauseRemainingMs : new Date(a.targetTime).getTime() - Date.now();
          const br = b.paused ? b.pauseRemainingMs : new Date(b.targetTime).getTime() - Date.now();
          return ar - br;
        })
        .forEach(t => {
          const target = new Date(t.targetTime);
          const remaining = t.paused ? t.pauseRemainingMs : target.getTime() - Date.now();

          const card = document.createElement("article");
          card.className = "timer";
          card.innerHTML = `
            <div class="timer-top">
              <div>
                <h2>${escapeHtml(t.name)}</h2>
                <div class="target">${target.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short" })}</div>
              </div>
              <button class="danger small" onclick="removeTimer('${t.id}')">Remove</button>
            </div>

            <div class="big">${formatRemaining(remaining)}</div>
            <div class="status ${remaining <= 5 * 60 * 1000 && remaining > 0 ? "highlight" : ""}">
              ${statusText(remaining, t.paused)}
            </div>

            <div class="timer-actions">
              <button class="secondary small" onclick="addMinutes('${t.id}', -1)">-1 min</button>
              <button class="secondary small" onclick="addMinutes('${t.id}', 1)">+1 min</button>
              <button class="secondary small" onclick="togglePause('${t.id}')">${t.paused ? "Resume" : "Pause"}</button>
              <button class="secondary small" onclick="resetTimer('${t.id}')">Reset</button>
            </div>
          `;

          root.appendChild(card);
        });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m]));
    }

    function updateClock() {
      const now = new Date();
      const timeText = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      document.getElementById("currentTime").textContent = timeText;
      const playerClock = document.getElementById("playerClock");
      if (playerClock) playerClock.textContent = timeText;
    }

    function updatePlayerCountClass() {
      document.body.classList.remove("count-1", "count-2", "count-3", "count-4", "count-5", "count-6", "count-many");
      const count = timers.length;
      if (count <= 1) document.body.classList.add("count-1");
      else if (count === 2) document.body.classList.add("count-2");
      else if (count === 3) document.body.classList.add("count-3");
      else if (count === 4) document.body.classList.add("count-4");
      else if (count === 5) document.body.classList.add("count-5");
      else if (count === 6) document.body.classList.add("count-6");
      else document.body.classList.add("count-many");
    }

    function enterPlayerMode() {
      updatePlayerCountClass();
      document.body.classList.add("player-mode");
      document.documentElement.requestFullscreen?.();
    }

    function exitPlayerMode() {
      document.body.classList.remove("player-mode", "count-1", "count-2", "count-3", "count-4", "count-5", "count-6", "count-many");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") exitPlayerMode();
    });

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) exitPlayerMode();
    });

    setInterval(() => {
      updateClock();
      render();
      if (document.body.classList.contains("player-mode")) updatePlayerCountClass();
    }, 1000);

    updateClock();
    render();
  </script>
</body>
</html>
